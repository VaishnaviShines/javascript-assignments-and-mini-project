<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><header>
    <h1>Product Inventory Dashboard</h1>
    <p>Manage products and track inventory value</p>
</header>

<main>
    <section class="summary">
        <div class="card">
            <h3>Total Products</h3>
            <p id="productCount">0</p>
        </div>

        <div class="card">
            <h3>Total Inventory Value</h3>
            <p id="totalValue">$0</p>
        </div>
    </section>

    <section class="panel">
        <h2>Add a Product</h2>

        <form id="productForm">
            <input
                type="text"
                id="productName"
                placeholder="Product name"
                required
            >

            <input
                type="number"
                id="productPrice"
                placeholder="Product price"
                min="0.01"
                step="0.01"
                required
            >

            <button type="submit">Add Product</button>
        </form>

        <p id="message"></p>
    </section>

    <section class="panel">
        <h2>Inventory List</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2>Affordable Products</h2>
        <p id="affordableProducts">Loading...</p>
    </section>
</main>

<footer>
    <p>Product Inventory & Analytics | JavaScript Mini Project</p>
</footer>

<script src="app.js"></script>

</body>
</html>
